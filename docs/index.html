<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Transporte JBS</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" >

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


  <!-- =====================================================
       CABEÇALHO
  ====================================================== -->

  <div class="card header">

    <h1>
      Transporte Colaboradores JBS
    </h1>

  </div>


  <!-- =====================================================
       TIPO DE TRANSPORTE
  ====================================================== -->

  <div class="switch-box">

    <button
      id="tab-inter"
      class="btn-switch active"
    >
      🚌 Intermunicipal
    </button>


    <button
      id="tab-muni"
      class="btn-switch"
    >
      🏙️ Urbano Lins
    </button>

  </div>


  <!-- =====================================================
       SENTIDO
  ====================================================== -->

  <div
    class="switch-box"
    id="box-sentido"
  >

    <button
      id="btn-ida"
      class="btn-switch active"
    >
      🏠 ➔ 🏢 Indo p/ JBS
    </button>


    <button
      id="btn-volta"
      class="btn-switch"
    >
      🏢 ➔ 🏠 Voltando p/ CASA
    </button>

  </div>


  <!-- =====================================================
       DESTAQUE
  ====================================================== -->

  <div class="highlight">

    <div
      style="
        font-size:0.75rem;
        font-weight:bold;
        text-transform:uppercase;
      "
      id="lbl-tipo"
    >
      PROXIMO EMBARQUE PARA A JBS
    </div>


    <div
      class="time-large"
      id="txt-horario"
    >
      --:--
    </div>


    <div
      class="info-line"
      id="txt-contador"
    >
      Aguardando seleção...
    </div>


    <hr
      style="
        margin:10px 0;
        opacity:0.3;
      "
    >


    <div
      class="info-line"
      id="txt-detalhes"
    >
      📍 Selecione sua cidade e consulte o ponto.
    </div>

  </div>


  <!-- =====================================================
       CONFIGURAÇÃO / GPS
  ====================================================== -->

  <div class="card">


    <div id="group-cidade">

      <label>
        CIDADE:
      </label>


      <select id="sel-cidade">
  <option value="Cafelândia" selected>Cafelândia</option>
  <option value="Promissão">Promissão</option>
  <option value="Sabino">Sabino</option>
  <option value="Guaiçara">Guaiçara</option>
  <option value="Getulina">Getulina</option>
  <option value="Guaimbê">Guaimbê</option>
  <option value="Pirajuí">Pirajuí</option>
  <option value="Guarantã">Guarantã</option>
      </select>


    <!-- ENDEREÇO -->

    <div
      id="endereco-box"
      style="
        display:none;
        margin-top:10px;
      "
    >

      <label>
        ENDEREÇO:
      </label>


      <input
        type="text"
        id="ipt-rua"
        placeholder="Digite sua rua ou endereço"
      >


      <div class="btn-group">

        <button
          id="btn-search"
          class="btn btn-search"
        >
          🔎 Buscar endereço
        </button>

      </div>

    </div>


    <!-- GPS -->

    <div class="btn-group">

      <button
        id="btn-gps"
        class="btn btn-gps"
      >
        📡 Usar GPS do Celular
      </button>

    </div>


    <!-- MAPA -->

    <div id="map"></div>

  </div>


  <!-- =====================================================
       PONTOS
  ====================================================== -->

  <div class="card">

    <h3
      style="
        font-size:0.9rem;
        margin-bottom:8px;
      "
      id="lbl-titulo-pontos"
    >
      📍 Pontos Cadastrados
    </h3>


    <div
      id="lista-pontos"
      style="
        max-height:220px;
        overflow-y:auto;
      "
    ></div>

  </div>


  <!-- =====================================================
       HORÁRIOS
  ====================================================== -->

  <div class="card">

    <h3
      style="
        font-size:0.9rem;
        margin-bottom:8px;
      "
    >
      ⏰ Horários da Linha
    </h3>


    <div
      id="lista-horarios"
      style="
        max-height:250px;
        overflow-y:auto;
      "
    ></div>

  </div>


  <!-- =====================================================
       DÚVIDAS / RH
  ====================================================== -->

  <div class="card duvidas-box">

    <h3>
      ❓ Dúvidas
    </h3>

      <strong>Procurar RH:</strong><br>

      📞 3511-4782<br>

      ✉️ rotinas.lins@friboi.com.br

    </div>

  </div>


</div>

/* =========================================================
   DISTÂNCIA
========================================================= */

function calcularDistancia(
  lat1,
  lon1,
  lat2,
  lon2
) {

  var R = 6371;

  var dLat =
    (lat2 - lat1) *
    Math.PI / 180;

  var dLon =
    (lon2 - lon1) *
    Math.PI / 180;

  var a =
    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +

    Math.cos(
      lat1 * Math.PI / 180
    ) *

    Math.cos(
      lat2 * Math.PI / 180
    ) *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);

  return R *
    (
      2 *
      Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
      )
    );

}


/* =========================================================
   PRÓXIMO HORÁRIO
========================================================= */

function obterProximoHorario() {

  if (
    modoAtual !==
    'INTERMUNICIPAL'
  ) {

    return null;

  }


  var cidade =
    document
      .getElementById(
        'sel-cidade'
      )
      .value;


  var agora =
    new Date();


  var minutosAgora =
    agora.getHours() * 60 +
    agora.getMinutes();


  var horarios =
    DATA_HORARIOS.filter(
      function(h) {

        return (
          h.cidade === cidade &&
          h.sentido === sentidoAtual
        );

      }
    );


  var proximo = null;

  var menorDiferenca =
    Infinity;


  horarios.forEach(
    function(h) {

      var partes =
        h.hora.split(':');


      var minutos =
        parseInt(partes[0]) * 60 +
        parseInt(partes[1]);


      var diferenca =
        minutos - minutosAgora;


      if (diferenca < 0) {

        diferenca += 1440;

      }


      if (
        diferenca <
        menorDiferenca
      ) {

        menorDiferenca =
          diferenca;

        proximo = {

          horario: h,

          diferenca:
            diferenca

        };

      }

    }
  );


  return proximo;

}


/* =========================================================
   MELHOR PONTO
========================================================= */

function encontrarMelhorPonto() {

  if (!userPos) {

    return null;

  }


  var cidade =
    document
      .getElementById(
        'sel-cidade'
      )
      .value;


  var pontos =
    DATA_PONTOS.filter(
      function(p) {

        return (
          p.cidade === cidade
        );

      }
    );


  if (!pontos.length) {

    return null;

  }


  pontos.forEach(
    function(p) {

      p.dist =
        calcularDistancia(

          userPos.lat,
          userPos.lng,

          p.lat,
          p.lng

        );

    }
  );

  // DEBUG: log distances for diagnosis
  try {
    console.groupCollapsed('Debug: distâncias para pontos (cidade=' + cidade + ')');
    pontos.forEach(function(p){
      console.log(p.ponto + ':', p.dist.toFixed(2) + ' m', 'coords:', p.lat, p.lng);
    });
    console.groupEnd();
  } catch(e) {}


  pontos.sort(
    function(a, b) {

      return a.dist - b.dist;

    }
  );


  return pontos[0];

}

    m === 'INTERMUNICIPAL'
  ) {

    atualizarMapaComGPS(
      userPos
    );

  }

}

/* =========================================================
   GPS
========================================================= */

function verificarOrigemSegura() {

  var protocolo =
    window.location.protocol;

  var host =
    window.location.hostname;

  var ehLocalhost =
    host === 'localhost' ||
    host === '127.0.0.1' ||
    host === '';

  if (
    protocolo === 'file:' ||
    (protocolo === 'http:' && !ehLocalhost)
  ) {

    alert(
      'O GPS só funciona em origem segura.\n\nUse o projeto em http://localhost ou em HTTPS (GitHub Pages), não em file:// ou site HTTP público.'
    );

    return false;

  }

  return true;

}

function usarGPS() {

  if (!verificarOrigemSegura()) {
    return;
  }

  if (
    !navigator.geolocation
  ) {

    alert(
      'GPS não suportado neste aparelho.'
    );

    return;

  }


  if (
    gpsWatchId !== null
  ) {

    pararGPS();

    return;

  }


  var botao =
    document.getElementById(
      'btn-gps'
    );


  botao.innerText =
    '🛰️ GPS ativo';


  botao.classList.add(
    'active'
  );


  document
    .getElementById(
      'txt-detalhes'
    )
    .innerText =
    '📡 Obtendo sua localização...';


  gpsWatchId =
    navigator.geolocation.watchPosition(

      function(pos) {

        var novaPos = {

          lat:
            pos.coords.latitude,

          lng:
            pos.coords.longitude

        };


        userPos =
          novaPos;


        atualizarMapaComGPS(
          novaPos
        );


        recalcular();

      },


      function(err) {

        console.error(
          'Erro GPS:',
          err
        );


        alert(
          'Não foi possível obter sua localização. Verifique a permissão do GPS.'
        );


        pararGPS();

      },


      {

        enableHighAccuracy:
          true,

        maximumAge:
          5000,

        timeout:
          15000

      }

    );

}


/* =========================================================
   PARAR GPS
========================================================= */

function pararGPS() {

  if (
    gpsWatchId !== null
  ) {

    navigator.geolocation.clearWatch(
      gpsWatchId
    );

    gpsWatchId = null;

  }


  var botao =
    document.getElementById(
      'btn-gps'
    );


  botao.innerText =
    '📡 Usar GPS do Celular';


  botao.classList.remove(
    'active'
  );

}


/* =========================================================
   PREPARAR MAPA
========================================================= */

function prepararMapa() {

  if (
    typeof L ===
    'undefined'
  ) {

    console.error(
      'Leaflet não foi carregado.'
    );

    return;

  }


  var mapEl =
    document.getElementById(
      'map'
    );


  if (!mapEl) {

    console.error(
      'Elemento #map não encontrado.'
    );

    return;

  }


  mapEl.style.display =
    'block';


  if (!leafletMap) {

    leafletMap =
      L.map(
        'map',
        {
          zoomControl:
            true,

          attributionControl:
            true
        }
      )
      .setView(
        [-21.67, -49.75],
        10
      );


    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {

        attribution:
          '&copy; OpenStreetMap contributors',

        maxZoom:
          19

      }
    )
    .addTo(
      leafletMap
    );


    allPointsLayer =
      L.layerGroup()
        .addTo(
          leafletMap
        );

  }


  setTimeout(
    function() {

      if (
        leafletMap
      ) {

        leafletMap.invalidateSize(
          true
        );

      }

    },
    100
  );

}


/* =========================================================
   DESENHAR PONTOS
========================================================= */

function desenharPontosSeNecessario() {

  prepararMapa();


  if (
    !leafletMap ||
    !allPointsLayer
  ) {

    return;

  }


  if (
    modoAtual !==
    'INTERMUNICIPAL'
  ) {

    allPointsLayer.clearLayers();

    pontosCidadeAtual = null;

    return;

  }


  var cidade =
    document
      .getElementById(
        'sel-cidade'
      )
      .value;


  if (
    pontosCidadeAtual ===
    cidade &&
    allPointsLayer.getLayers()
      .length > 0
  ) {

    return;

  }


  allPointsLayer.clearLayers();


  pontosCidadeAtual =
    cidade;


  var pontos =
    DATA_PONTOS.filter(
      function(p) {

        return (
          p.cidade === cidade
        );

      }
    );


  var iconBus =
    L.divIcon({

      className:
        'custom-pin',

      html:
        '🚏',

      iconSize:
        [28, 28],

      iconAnchor:
        [14, 14]

    });


  pontos.forEach(
    function(p) {

      var marker =
        L.marker(

          [
            p.lat,
            p.lng
          ],

          {
            icon:
              iconBus
          }

        );


      marker.bindPopup(

        '<strong>🚏 ' +
        p.ponto +
        '</strong><br>' +

        p.loc

      );


      marker.addTo(
        allPointsLayer
      );

    }
  );

}


/* =========================================================
   ATUALIZAR MAPA COM GPS
========================================================= */

function atualizarMapaComGPS(
  posicao
) {

  prepararMapa();


  if (!leafletMap) {

    return;

  }


  desenharPontosSeNecessario();


  if (
    modoAtual !==
    'INTERMUNICIPAL'
  ) {

    if (userMarker) {

      userMarker.setLatLng(
        [
          posicao.lat,
          posicao.lng
        ]
      );

    } else {

      criarMarcadorUsuario(
        posicao
      );

    }

    return;

  }


  if (!userMarker) {

    criarMarcadorUsuario(
      posicao
    );

  } else {

    userMarker.setLatLng(

      [
        posicao.lat,
        posicao.lng
      ]

    );

  }


  var destino =
    encontrarMelhorPonto();


  if (!destino) {

    document
      .getElementById(
        'txt-detalhes'
      )
      .innerText =
      '📍 Nenhum ponto encontrado.';

    return;

  }


  var destinoMudou =
    ultimoDestinoPonto !==
    destino.ponto;


  selectedDestination =
    destino;


  ultimoDestinoPonto =
    destino.ponto;


  criarOuAtualizarMarcadorDestino(
    destino
  );


  if (
    lastRouteLat === null ||
    lastRouteLng === null
  ) {

    desenharRotaSemOscilacao(
      posicao,
      destino
    );

    return;

  }


  if (destinoMudou) {

    desenharRotaSemOscilacao(
      posicao,
      destino
    );

    return;

  }


  var distanciaAtual =
    calcularDistancia(

      lastRouteLat,
      lastRouteLng,

      posicao.lat,
      posicao.lng

    ) * 1000;


  if (
    distanciaAtual >=
    MIN_ROUTE_UPDATE_METERS
  ) {

    desenharRotaSemOscilacao(
      posicao,
      destino
    );

  }

}

/* =========================================================
   DESENHAR ROTA
========================================================= */

function desenharRotaSemOscilacao(
  origem,
  destino
) {

  if (!leafletMap) {

    return;

  }


  if (routeBusy) {

    return;

  }


  routeBusy =
    true;


  lastRouteLat =
    origem.lat;

  lastRouteLng =
    origem.lng;


  document
    .getElementById(
      'txt-detalhes'
    )
    .innerHTML =

      '🗺️ Calculando rota até <strong>' +

      destino.ponto +

      '</strong>...';


  if (
    typeof google !==
      'undefined' &&

    google.script &&

    google.script.run
  ) {

    google.script.run

      .withSuccessHandler(
        function(data) {

          routeBusy =
            false;


          if (
            data &&
            data.coordinates &&
            data.coordinates.length > 1
          ) {

            atualizarLinhaDaRota(
              data.coordinates
            );

            return;

          }


          buscarRotaDireta(
            origem,
            destino
          );

        }
      )


      .withFailureHandler(
        function(error) {

          console.error(
            'Erro Apps Script:',
            error
          );


          routeBusy =
            false;


          buscarRotaDireta(
            origem,
            destino
          );

        }
      )


      .obterRota(

        origem.lat,
        origem.lng,

        destino.lat,
        destino.lng

      );


  } else {

    routeBusy =
      false;


    buscarRotaDireta(
      origem,
      destino
    );

  }

}


/* =========================================================
   ATUALIZAR LINHA DA ROTA
========================================================= */

function atualizarLinhaDaRota(
  coordinates
) {

  if (!leafletMap) {

    return;

  }


  if (
    !coordinates ||
    coordinates.length < 2
  ) {

    return;

  }


  var coords =
    coordinates.map(
      function(c) {

        return [

          parseFloat(c[1]),

          parseFloat(c[0])

        ];

      }
    );


  if (!routeLine) {

    routeLine =
      L.polyline(

        coords,

        {

          color:
            '#00BFFF',

          weight:
            5,

          opacity:
            0.9,

          lineCap:
            'round',

          lineJoin:
            'round'

        }

      )
      .addTo(
        leafletMap
      );


  } else {

    routeLine.setLatLngs(
      coords
    );

  }


  document
    .getElementById(
      'txt-detalhes'
    )
    .innerHTML =

      '🗺️ Rota até <strong>' +

      (
        selectedDestination
          ? selectedDestination.ponto
          : 'o ponto'
      ) +

      '</strong> seguindo as ruas.';

}


/* =========================================================
   GEOCODIFICAÇÃO DIRETA (NOMINATIM)
   Usada quando não há backend do Apps Script disponível
   (versão estática hospedada no GitHub Pages).
========================================================= */

function consultarNominatimCliente(query) {

  var url =
    'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q=' +
    encodeURIComponent(query);

  return fetch(url)
    .then(function(response) {

      if (!response.ok) {
        return [];
      }

      return response.json();

    })
    .then(function(data) {

      if (data && data.length > 0) {

        return {
          lat: parseFloat(data[0].lat),
          lng: parseFloat(data[0].lon)
        };

      }

      return null;

    })
    .catch(function(err) {

      console.error('Erro no geocode:', err);

      return null;

    });

}


function geocodeEnderecoCliente(endereco) {

  return consultarNominatimCliente(endereco)
    .then(function(coords) {

      if (coords) {
        return coords;
      }

      var enderecoSemNumero =
        String(endereco)
          .replace(/\d+/g, '')
          .replace(/\s+/g, ' ')
          .trim();

      if (enderecoSemNumero !== endereco) {
        return consultarNominatimCliente(enderecoSemNumero);
      }

      return null;

    });

}


/* =========================================================
   ROTA DIRETA OSRM
========================================================= */

function buscarRotaDireta(
  origem,
  destino
) {

  var url =

    'https://router.project-osrm.org/route/v1/driving/' +

    origem.lng +
    ',' +
    origem.lat +

    ';' +

    destino.lng +
    ',' +
    destino.lat +

    '?overview=full&geometries=geojson';


  fetch(url)

    .then(
      function(response) {

        if (!response.ok) {

          throw new Error(
            'HTTP ' +
            response.status
          );

        }


        return response.json();

      }
    )


    .then(
      function(data) {

        routeBusy =
          false;


        if (
          data &&
          data.routes &&
          data.routes.length > 0 &&
          data.routes[0].geometry &&
          data.routes[0].geometry.coordinates
        ) {

          atualizarLinhaDaRota(

            data.routes[0]
              .geometry
              .coordinates

          );

        } else {

          throw new Error(
            'Nenhuma rota encontrada'
          );

        }

      }
    )


    .catch(
      function(error) {

        routeBusy =
          false;


        console.error(
          'Erro no roteamento:',
          error
        );


        document
          .getElementById(
            'txt-detalhes'
          )
          .innerText =
          '⚠️ Não foi possível calcular a rota pelas ruas.';

      }
    );

}


/* =========================================================
   BUSCAR ENDEREÇO
========================================================= */

function buscarEndereco() {

  var rua =
    document
      .getElementById(
        'ipt-rua'
      )
      .value.trim();


  var cidade =
    document
      .getElementById(
        'sel-cidade'
      )
      .value;


  if (!rua) {

    alert(
      'Digite o endereço.'
    );

    return;

  }


  var ruaTratada =
    rua

      .replace(
        /Rua:|Av:|Avenida:|Praça:/gi,
        ''
      )

      .replace(
        /\sx\s/gi,
        ' e '
      )

      .trim();


  var queryCompleta =
    ruaTratada +
    ', ' +
    cidade +
    ', SP, Brasil';


  document
    .getElementById(
      'txt-detalhes'
    )
    .innerText =
    '⏳ Buscando endereço...';


  if (
    typeof google !==
      'undefined' &&

    google.script &&

    google.script.run
  ) {

    google.script.run

      .withSuccessHandler(
        function(coords) {

          if (
            coords &&
            coords.lat !== undefined &&
            coords.lng !== undefined
          ) {

            userPos = {

              lat:
                parseFloat(
                  coords.lat
                ),

              lng:
                parseFloat(
                  coords.lng
                )

            };


            atualizarMapaComGPS(
              userPos
            );


            recalcular();


          } else {

            alert(
              'Endereço não localizado.'
            );

          }

        }
      )


      .withFailureHandler(
        function(error) {

          console.error(
            error
          );


          alert(
            'Erro na busca de endereço.'
          );

        }
      )


      .geocodeEndereco(

        queryCompleta

      );


  } else {

    geocodeEnderecoCliente(queryCompleta)

      .then(function(coords) {

        if (coords) {

          userPos = coords;

          atualizarMapaComGPS(
            userPos
          );

          recalcular();

        } else {

          alert(
            'Endereço não localizado.'
          );

        }

      })

      .catch(function(err) {

        console.error(err);

        alert(
          'Erro na busca de endereço.'
        );

      });

  }

}


/* =========================================================
   RECALCULAR
========================================================= */

function recalcular() {

  renderizarPontos();

  renderizarHorarios();

}

  ) {

      );

    document
      .getElementById(
        'sel-cidade'
      )
      .value;

    DATA_PONTOS.filter(

          p.cidade === cidade
        );

      }
    );


  if (userPos) {

        p.dist =
          calcularDistancia(

            userPos.lat,
            userPos.lng,

            p.lat,
            p.lng

          );

      }
    );


    lista.sort(
      function(a, b) {

        return a.dist - b.dist;

      }
    );

  }


  lista.forEach(
    function(p) {

      var selecionado =

        selectedDestination &&

        selectedDestination.ponto ===
          p.ponto;

            : ''

        '<span style="' +

        'color:#666;' +

        '">' +

        p.loc +

        '</div>' +

        '<span class="dist-tag">' +

        (

          p.dist !== undefined

            ? p.dist.toFixed(2) +

              ' km'

            : ''

        ) +

        '</span>' +

        '</div>';

    }
  );

}


/* =========================================================
   LISTA DE HORÁRIOS
========================================================= */

function renderizarHorarios() {

  var div =
    document.getElementById(
      'lista-horarios'
    );


  div.innerHTML =
    '';


  var agora =
    new Date();


  var minutosAgora =
    agora.getHours() * 60 +
    agora.getMinutes();


  var listaHorarios = [];


  if (
    modoAtual ===
    'INTERMUNICIPAL'
  ) {

    var cidade =
      document
        .getElementById(
          'sel-cidade'
        )
        .value;


    listaHorarios =
      DATA_HORARIOS.filter(
        function(h) {

          return (

            h.cidade ===
              cidade &&

            h.sentido ===
              sentidoAtual

          );

        }
      );


  } else {

    listaHorarios =
      DATA_MUNICIPAL_HORARIOS;

  }


  var proximo =
    null;


  var menorDiff =
    Infinity;


  listaHorarios.forEach(
    function(h) {

      var partes =
        h.hora.split(':');


      var minViagem =
        parseInt(partes[0]) * 60 +
        parseInt(partes[1]);


      var diff =
        minViagem -
        minutosAgora;


      if (diff < 0) {

        diff += 1440;

      }


      if (
        diff <
        menorDiff
      ) {

        menorDiff =
          diff;

        proximo =
          h;

      }


      div.innerHTML +=

        '<div class="item">' +

        '<div>' +

        '<strong>' +

        h.hora +

        ' hs</strong> ' +

        (

          h.veiculo

            ? '- ' +
              h.veiculo

            : ''

        ) +

        '<div style="' +

        'font-size:0.75rem;' +

        'color:#666;' +

        '">' +

        (

          h.trajeto ||
          ''

        ) +

        '</div>' +

        '</div>' +

        '<span class="status">' +

        'Plat. ' +

        h.plat +

        '</span>' +

        '</div>';

    }
  );


  if (!proximo) {

    document
      .getElementById(
        'txt-horario'
      )
      .innerText =
      '--:--';


    document
      .getElementById(
        'txt-contador'
      )
      .innerText =
      'Sem horários cadastrados';


    return;

  }


  document
    .getElementById(
      'txt-horario'
    )
    .innerText =
    proximo.hora;


  var horas =
    Math.floor(
      menorDiff / 60
    );


  var minutos =
    menorDiff % 60;


  document
    .getElementById(
      'txt-contador'
    )
    .innerText =

      horas > 0

        ? 'Saída em ~' +
          horas +
          'h ' +
          minutos +
          'min'

        : 'Saída em ~' +
          minutos +
          ' min';


  var detalhe = '';

if (modoAtual === 'INTERMUNICIPAL') {

  detalhe =

    '🏷️ <strong>Plataforma / Tipo:</strong> ' +

    proximo.plat +

    '<br>' +

    '🚌 <strong>Veículo:</strong> ' +

    (
      proximo.veiculo ||
      'Linha Regular'
    );

} else {

  detalhe =

    '🚌 <strong>Próxima saída para a JBS</strong>' +

    '<br>' +

    '🏷️ <strong>Plataforma de chegada na JBS:</strong> ' +

    proximo.plat +

    '<br>' +

    '📍 <strong>Destino:</strong> JBS';

}


  if (
    selectedDestination &&
    modoAtual ===
      'INTERMUNICIPAL'
  ) {

    detalhe +=

      '<br>📍 <strong>Ponto recomendado:</strong> ' +

      selectedDestination.ponto +

      '<br>📏 <strong>Distância:</strong> ' +

      selectedDestination.dist.toFixed(2) +

      ' km';

  }


  document
    .getElementById(
      'txt-detalhes'
    )
    .innerHTML =
    detalhe;

}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

document.addEventListener(

  'DOMContentLoaded',

  function() {


    document
      .getElementById(
        'tab-inter'
      )
      .addEventListener(
        'click',
        function() {

          trocarModo(
            'INTERMUNICIPAL'
          );

        }
      );


    document
      .getElementById(
        'tab-muni'
      )
      .addEventListener(
        'click',
        function() {

          trocarModo(
            'MUNICIPAL'
          );

        }
      );


    document
      .getElementById(
        'btn-ida'
      )
      .addEventListener(
        'click',
        function() {

          trocarSentido(
            'IDA'
          );

        }
      );


    document
      .getElementById(
        'btn-volta'
      )
      .addEventListener(
        'click',
        function() {

          trocarSentido(
            'VOLTA'
          );

        }
      );


    document
      .getElementById(
        'sel-cidade'
      )
      .addEventListener(
        'change',
        function() {

          selectedDestination =
            null;

          ultimoDestinoPonto =
            null;

          lastRouteLat =
            null;

          lastRouteLng =
            null;

          pontosCidadeAtual =
            null;


          if (routeLine) {

            routeLine.setLatLngs(
              []
            );

          }


          recalcular();


          // Always render points for the selected city so markers
          // are visible even when GPS (userPos) is not active.
          desenharPontosSeNecessario();

          if (userPos) {

            atualizarMapaComGPS(
              userPos
            );

          }

        }
      );


    document
      .getElementById(
        'btn-gps'
      )
      .addEventListener(
        'click',
        usarGPS
      );


    document
      .getElementById(
        'btn-search'
      )
      .addEventListener(
        'click',
        buscarEndereco
      );


    recalcular();


    prepararMapa();

    desenharPontosSeNecessario();


    setInterval(
      function() {

        renderizarHorarios();

      },
      60000
    );


  }

);


</script>


</body>

</html>
